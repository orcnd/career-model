# CPU-only LoRA experiment for the Ryzen 5 5600G / 30 GB RAM host.
# Deliberately no bitsandbytes or QLoRA: these require a supported accelerator.
base_model: Qwen/Qwen2.5-0.5B-Instruct
output_dir: models/qwen-0.5b-career-lora-cpu
dataset_dir: data/generated
learning_rate: 0.0003
num_train_epochs: 120
gradient_accumulation_steps: 4
max_seq_length: 128
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
seed: 42
