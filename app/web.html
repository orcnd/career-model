<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Orçun · Local Chat</title>
  <style>
    :root{color-scheme:dark;--bg:#0c1016;--panel:#141b25;--line:#263244;--text:#e8edf5;--muted:#91a0b5;--accent:#8dd6ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#183047,var(--bg) 48%);color:var(--text);font:15px system-ui,sans-serif}.shell{max-width:920px;height:100vh;margin:auto;display:flex;flex-direction:column;padding:28px 18px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:18px}.identity{display:flex;align-items:center;gap:12px}.avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);background:#183047}h1{font-size:20px;margin:0 0 5px}.sub{margin:0;color:var(--muted)}.availability{display:inline-flex;align-items:center;gap:6px;margin-top:5px;color:#9be7bd;font-size:12px}.availability::before{content:'';width:7px;height:7px;border-radius:50%;background:#5ed58e;box-shadow:0 0 9px #5ed58e}button{background:#1e3043;color:var(--text);border:1px solid #36536d;border-radius:8px;padding:9px 12px;cursor:pointer}.chat{flex:1;overflow:auto;padding:25px 0;display:flex;flex-direction:column;gap:14px}.message{max-width:78%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;white-space:pre-wrap;line-height:1.45}.user{align-self:flex-end;background:#19344b}.assistant{align-self:flex-start;background:var(--panel)}.notice{color:var(--muted);font-size:13px}.compose{display:flex;gap:10px;padding-top:15px;border-top:1px solid var(--line)}textarea{flex:1;resize:none;min-height:48px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:13px;font:inherit}.send{background:#28709d}.status{font-size:12px;color:var(--muted);padding-top:8px}@media(max-width:600px){.shell{padding:16px}.message{max-width:90%}.avatar{width:44px;height:44px}}
  </style>
</head>
<body><main class="shell"><header><div class="identity"><img class="avatar" src="/assets/orcun-avatar.png" alt="AI Orçun"><div><h1>AI Orçun</h1><p class="sub">Recruiter’lar için kanıta dayalı, interview-ready kariyer yanıtları.</p><span class="availability">Yerel model hazır</span></div></div><button id="reset">Yeni sohbet</button></header><section class="chat" id="chat"><div class="notice" id="welcome">Yerel model kontrol ediliyor…</div></section><form class="compose" id="form"><textarea id="question" placeholder="Örn. Neden Orçun’u işe almalıyız?" required></textarea><button class="send">Gönder</button></form><div class="status" id="status"></div></main>
<script>
const id = localStorage.careerSession || crypto.randomUUID(); localStorage.careerSession=id;
const chat=document.querySelector('#chat'), status=document.querySelector('#status'), input=document.querySelector('#question');
const promptHistory=[]; let promptHistoryIndex=0;
function add(kind,text,meta=''){const item=document.createElement('div');item.className=`message ${kind}`;const body=document.createElement('div');body.textContent=text;item.append(body);if(meta){const detail=document.createElement('div');detail.className='notice';detail.style.marginTop='8px';detail.textContent=meta;item.append(detail)}chat.append(item);chat.scrollTop=chat.scrollHeight;return item}
function humanize(text,question=''){try{const data=JSON.parse(text);if(data.answer==='yes'&&data.evidence)return data.evidence;if(data.answer==='no')return `No — I don’t have documented professional experience with that.`;if(data.answer==='insufficient_evidence')return `I don’t have enough documented information to confidently answer that.`}catch{}return text}
async function health(){const r=await fetch('/health');const d=await r.json();document.querySelector('#welcome').textContent=d.status==='ready_gguf'?'Local Q4 GGUF is ready.':d.status==='ready_cpu_adapter'?'Fine-tuned CPU adapter is ready. GGUF Q4 export is still pending.':'Waiting for a fine-tuned local model. The interface will never switch to an online model.'}
async function restore(){const r=await fetch(`/sessions/${id}`);const d=await r.json();d.messages.forEach(m=>{add(m.role,m.content);if(m.role==='user')promptHistory.push(m.content)});promptHistoryIndex=promptHistory.length;health()}restore();
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const question=input.value.trim();if(!question)return;if(promptHistory.at(-1)!==question)promptHistory.push(question);promptHistoryIndex=promptHistory.length;add('user',question);input.value='';status.textContent='Thinking locally…';try{const r=await fetch('/ask',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({session_id:id,question})});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Request failed');add('assistant',humanize(d.answer,question),`${new Date().toLocaleString()} · ${d.latency_seconds}s`);status.textContent=`${d.retained_turns} turns retained · ${d.latency_seconds}s`}catch(err){add('assistant',err.message);status.textContent='No fallback model was used.'}});
input.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();document.querySelector('#form').requestSubmit()}if(event.key==='ArrowUp'&&input.value===''&&promptHistory.length){event.preventDefault();promptHistoryIndex=Math.max(0,promptHistoryIndex-1);input.value=promptHistory[promptHistoryIndex];input.setSelectionRange(input.value.length,input.value.length)}});
document.querySelector('#reset').addEventListener('click',async()=>{await fetch(`/sessions/${id}`,{method:'DELETE'});promptHistory.length=0;promptHistoryIndex=0;chat.replaceChildren();status.textContent='New session started.';add('assistant','New local conversation started.');});
</script></body></html>
